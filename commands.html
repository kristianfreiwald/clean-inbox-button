<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Clean Inbox command</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script>
    // Make webhook that starts "Clean Inbox - Yahoo"
    const WEBHOOK_URL = "https://hook.us1.make.com/yy24j1ile7job9p5rr2s71516xsytvsr";

    function notify(message, isError) {
      try {
        const item = Office.context.mailbox.item;
        if (!item) return;
        item.notificationMessages.replaceAsync("cleanInbox", isError
          ? { type: Office.MailboxEnums.ItemNotificationMessageType.ErrorMessage, message }
          : { type: Office.MailboxEnums.ItemNotificationMessageType.InformationalMessage,
              message, icon: "Icon.16", persistent: false });
      } catch (e) { /* notifications are best-effort */ }
    }

    async function cleanInbox(event) {
      try {
        await fetch(WEBHOOK_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ source: "outlook-button", at: new Date().toISOString() })
        });
        notify("Inbox cleanup started. Spam will be moved to Trash in a minute or two.");
      } catch (e) {
        notify("Could not reach Make: " + e.message, true);
      } finally {
        event.completed();
      }
    }

    Office.onReady(() => {
      Office.actions.associate("cleanInbox", cleanInbox);
    });
  </script>
</head>
<body></body>
</html>
